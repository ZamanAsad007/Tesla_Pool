services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
      POSTGRES_DB: dhaka_tesla_pool
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://tesla:tesla@db:5432/dhaka_tesla_pool
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && if [ -f prisma/seed.js ]; then node prisma/seed.js; fi && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata: {}
