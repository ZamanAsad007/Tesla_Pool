name: Keep Render & Supabase Awake

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes — comfortably under Render's 15-min spindown
  workflow_dispatch: {}       # adds a "Run workflow" button for manual testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping backend /health
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL")
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Health check returned $status instead of 200 — backend or DB may be down, not just cold-starting"
          fi
        env:
          HEALTH_URL: https://tesla-pool-jz5w.onrender.com/health
