<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 480 330" width="100%" height="100%">
  <defs>
    <style>
      .line {
        fill: none;
        stroke: #10B981;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  <g transform="translate(50, 50)">
      <!-- Back Wheel / Speed lines -->
      <path class="line" d="M 180 380 A 60 60 0 0 0 280 380" />
      <path class="line" d="M 140 410 L 290 410" />
      <path class="line" d="M 170 330 C 140 350, 150 390, 170 410" />
      
      <!-- Front Wheel / Speed lines -->
      <circle class="line" cx="500" cy="350" r="50" />
      <path class="line" d="M 450 410 L 560 410" />
      
      <!-- Frame Connection -->
      <path class="line" d="M 230 380 L 320 380 L 360 300 L 410 300" />
      <path class="line" d="M 320 380 L 370 350 L 450 350" />
      <path class="line" d="M 500 350 L 470 250 L 440 250" />
      <path class="line" d="M 470 250 L 490 250" />
      
      <!-- Driver Area -->
      <path class="line" d="M 380 300 C 380 270, 360 260, 360 260 L 370 260" />
      <path class="line" d="M 360 300 L 400 350 L 470 250" />
      
      <!-- Passenger Canopy (dynamic shape) -->
      <path class="line" d="M 360 150 L 270 170 C 230 190, 190 230, 200 270" />
      <path class="line" d="M 320 180 C 270 200, 230 250, 230 300" />
      <path class="line" d="M 200 270 C 180 270, 150 280, 130 290" />
      <path class="line" d="M 360 150 C 330 130, 270 130, 230 150 C 180 170, 140 190, 140 190" />
      <path class="line" d="M 240 150 L 220 220" />
      <path class="line" d="M 210 220 C 200 250, 220 320, 250 340 L 340 330" />
  </g>
</svg>
